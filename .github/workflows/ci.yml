name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Start production server
        run: |
          npm run start -- -p 3000 > server.log 2>&1 &
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost:3000/login || true)
            if [ "$code" = "200" ]; then echo "server ready"; exit 0; fi
            sleep 2
          done
          echo "server failed to become ready"
          tail -50 server.log
          exit 1
      - name: E2E admin matrix
        run: BASE_URL=http://localhost:3000 npm run test:e2e
      - name: Server log on failure
        if: failure()
        run: tail -100 server.log || true
